name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Prisma types are generated, not committed, so anything that imports
      # @prisma/client fails typecheck without this.
      - run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # The palette is low-contrast by design, which is exactly why this is a
      # blocking gate rather than a manual review step.
      - name: Contrast audit
        run: npm run audit:contrast

      - name: Unit tests
        run: npm run test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      # Only chromium: the Phase 0 suite checks design-system behaviour, not
      # cross-browser rendering. Add firefox/webkit when the responsive views
      # land in Phase 3.
      - name: Install browser
        run: npx playwright install --with-deps chromium

      # The design system's real failure mode is silent: a token that stops
      # resolving, glass that stops blurring, motion that ignores the
      # reduced-motion setting. These assert those in a real browser.
      - name: E2E
        run: npx playwright test
        env:
          # The suite never touches the database, but next build reads these.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
